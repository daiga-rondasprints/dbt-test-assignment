version: 2

models:
  - name: dim_date
    description: >
      Complete calendar-day dimension spanning all calendar years represented
      by transactions, supporting standard calendar drilldowns and date filters.
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: date_day
        tests:
          - not_null
          - unique
      - name: calendar_year
        tests:
          - not_null

  - name: dim_product
    description: >
      Product hierarchy is category -> product ID/name. Pack size is a packaging
      attribute (not another hierarchy level); the current source has one observed
      pack size per known product.
    columns:
      - name: product_key
        tests:
          - not_null
          - unique
      - name: product_name
        tests:
          - not_null
      - name: pack_size
        description: Units per pack as supplied; not used to redefine global revenue.
      - name: is_unknown
        tests:
          - not_null

  - name: dim_store
    description: >
      Store dimension with one modal source profile per store ID. Region is
      standardized from state_code where available; direct operating cost is
      retained once per store, not summed across transaction rows.
    columns:
      - name: store_key
        tests:
          - not_null
          - unique
      - name: store_name
        tests:
          - not_null
      - name: region_name
        tests:
          - not_null
      - name: is_unknown
        tests:
          - not_null

  - name: fct_sales
    description: >
      One row per transaction_id after source-version selection. Signed quantity
      preserves returns. Net sales include all rows; standard-cost gross profit
      is calculated only where standard cost is available. Standard cost is
      divided by pack_size to align it with unit_price; landed cost is a separate
      sensitivity measure. Gross profit is not net profit.
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: transaction_date
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: quantity
        tests:
          - not_null
      - name: net_sales
        tests:
          - not_null

  - name: mart_annual_sales
    description: Annual topline, cost-coverage, and YoY reporting. YoY percentages compare consecutive complete calendar years.
    columns:
      - name: year
        tests:
          - not_null
          - unique
      - name: net_sales
        tests:
          - not_null

  - name: mart_monthly_sales
    description: Monthly net sales and gross-profit trend with 12-month YoY comparisons.
    columns:
      - name: month_start
        tests:
          - not_null
          - unique

  - name: mart_product_performance
    description: Annual product-level sales, gross-profit, margin, returns, and YoY metrics.
    columns:
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

  - name: mart_region_performance
    description: Annual regional sales and gross-profit metrics using the normalized store region.
    columns:
      - name: region_name
        tests:
          - not_null

  - name: mart_store_performance
    description: >
      Annual store sales and gross profit. The two direct-cost scenarios show
      gross profit less the observed store cost interpreted as annual or monthly;
      neither is labelled or presented as net profit. Productivity measures
      divide store financials by the modal store square footage; invalid area
      values remain visible for investigation and produce null per-area metrics.
    columns:
      - name: store_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key

  - name: mart_team_kpi_scorecard
    description: >
      Common metric formulae presented through CEO, Finance, Merchandising,
      Store Operations and Sales Ops KPI views. Alternative cost bases are named
      sensitivities, not competing definitions of global net sales.
    columns:
      - name: year
        tests:
          - not_null
      - name: team_view
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CEO', 'Finance', 'Merchandising', 'Store Operations', 'Sales Ops']
      - name: metric_code
        tests:
          - not_null
      - name: metric_value
      - name: formula
        tests:
          - not_null
