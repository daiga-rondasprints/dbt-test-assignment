version: 2

models:
  - name: mart_data_quality_triage
    description: >
      Current rebuildable exception list from the immutable source and normalized
      attributes. It supports review and counts but is not a mutable workflow queue;
      the source provides no row ID beyond a deterministic content fingerprint.
    columns:
      - name: source_row_fingerprint
        description: Content fingerprint for row-level issues; null for entity-level conflicts.
      - name: transaction_id
        description: Source transaction ID, when the issue is row-specific.
      - name: source_version_rank
        description: Deterministic source version rank; rank 1 is selected and later ranks are excluded from the event fact.
      - name: version_disposition
        description: Whether the source row is selected into the fact or retained in duplicate-version triage.
      - name: issue_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['source_row', 'product', 'store']
      - name: issue_code
        tests:
          - not_null
      - name: severity
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['review', 'information']
      - name: version_disposition
        tests:
          - accepted_values:
              arguments:
                values: ['selected_for_fact', 'triage_duplicate_version']
      - name: issue_details
        tests:
          - not_null
