version: 2

models:
  - name: stg_consolidated_transactions
    description: >
      Typed and consistently named view of the raw extract. This preserves all
      source rows, including transaction-ID collisions, returns, and missing
      product/store identifiers; downstream models handle those explicitly.
    columns:
      - name: transaction_id
        description: Source transaction identifier; collisions are resolved downstream.
        tests:
          - not_null
      - name: transaction_date
        description: Economic transaction date, retained separately from ingestion time.
        tests:
          - not_null
      - name: ingested_at
        description: Source lineage timestamp; not treated as the economic transaction date.
      - name: source_row_fingerprint
        description: Deterministic hash of the typed source row; the upstream extract has no line ID.
        tests:
          - not_null
      - name: quantity
        description: Signed unit quantity; negative values are retained as returns or adjustments.
      - name: product_id
        description: Nullable source product identifier; 99901 is a source unknown placeholder.
      - name: store_id
        description: Nullable source store identifier; 99901 is a source unknown placeholder.
      - name: pack_size
        description: Units in a selling pack; used to align standard cost to the unit-price grain.